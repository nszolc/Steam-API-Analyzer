[project]
name = "steam-api-analyzer"
version = "0.1.0"
description = "Analysis of a personal Steam library with pandas and the Steam Web API."
readme = "README.md"
authors = [
    { name = "Natalia Szolc" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "mypy>=2.4.0",
    "nbstripout>=0.9.1",
    "pandas-stubs>=3.0.5.260914",
    "ruff>=0.16.10",
    "types-requests>=2.33.0.20260906",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
